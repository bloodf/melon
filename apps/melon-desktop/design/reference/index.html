<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melon Modern Relay reference</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0a0d16;color:#f4f5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0d16}.app{min-height:100vh;padding:clamp(18px,3vw,42px);display:grid;grid-template-columns:88px minmax(0,1fr);gap:18px}.rail{border-radius:20px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:18px;background:#111625;border:1px solid #252b3d}.mark{width:46px;height:46px;display:grid;place-items:center;margin-bottom:14px;background:#d7ff4f;color:#10130a;border-radius:15px 15px 15px 4px;font-size:23px;font-weight:900}.rail-dot{width:30px;height:30px;border-radius:10px;background:#20283b;border:1px solid #2c354b}.workspace{border-radius:20px;padding:clamp(28px,5vw,72px);position:relative;overflow:hidden;background:linear-gradient(150deg,#141928,#0c101b);border:1px solid #292f41;display:flex;flex-direction:column;justify-content:center}.workspace:after{content:"";position:absolute;width:320px;height:320px;right:-130px;top:-130px;border:1px solid rgba(215,255,79,.35);border-radius:50%;box-shadow:0 0 0 44px rgba(215,255,79,.025),0 0 0 88px rgba(215,255,79,.02)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:750;color:#b5bfce}.title{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(38px,6vw,76px);line-height:.98;margin:15px 0 14px;font-weight:800;letter-spacing:-.065em;max-width:850px}.sub{color:#aab2c2;font-size:clamp(16px,2vw,21px);line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:42px;max-width:900px}.choice{border-radius:16px;padding:22px;min-height:126px;background:#101625;border:1px solid #30394f;color:#aeb7c8;line-height:1.5}.choice strong{display:block;color:#f4f5fa;font-size:17px;margin-bottom:9px}.button{align-self:flex-start;border:0;border-radius:999px;padding:13px 22px;margin-top:28px;font-weight:800;font-size:15px;background:#d7ff4f;color:#121508}@media(max-width:760px){.app{grid-template-columns:64px 1fr;padding:12px;gap:10px}.rail{padding:14px 8px}.mark{width:38px;height:38px}.choices{grid-template-columns:1fr;margin-top:28px}.workspace{padding:24px}.title{font-size:36px}}
</style>
</head>
<body><main class="app"><aside class="rail" aria-label="Product rail"><div class="mark" aria-label="Melon">M</div><div class="rail-dot"></div><div class="rail-dot"></div><div class="rail-dot"></div></aside><section class="workspace"><div class="eyebrow">Melon / Setup</div><h1 class="title">ONE CLIENT.<br>ANY MODEL.</h1><p class="sub">Route DeepSeek Harness through DurinDoor.</p><div class="choices"><article class="choice"><strong>Local runtime</strong>Download and run DurinDoor beside Melon.</article><article class="choice"><strong>Remote gateway</strong>Connect with a URL and optional API key.</article></div><button class="button" type="button">Configure</button></section></main></body>
</html>
