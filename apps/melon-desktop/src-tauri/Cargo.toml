[package]
name = "melon-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
keyring = { version = "=4.1.6", default-features = false, features = ["v1"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
url = "2.5.8"
tokio = { version = "1.53.1", features = ["time"] }
sha2 = "0.10.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
