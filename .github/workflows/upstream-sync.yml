# Keep bloodf/melon:master current with deepseek-ai/deepseek-harness:master.
# Melon product work stays on feat/melon-desktop (and other feature branches).
# This workflow is the only Melon-owned file that must remain on master so the
# schedule keeps running. Never fast-forward master onto upstream — that would
# delete this file and stop future syncs.
name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  update-master:
    name: Update master from upstream
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out Melon master
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master

      - name: Merge upstream master
        id: merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: deepseek-ai/deepseek-harness
        run: |
          set -euo pipefail
          git config user.name "melon-sync"
          git config user.email "melon-sync@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch --no-tags upstream master
          git fetch --no-tags origin master
          git checkout -B master origin/master

          upstream_sha="$(git rev-parse upstream/master)"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "master already contains ${upstream_sha}"
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit --no-ff --no-verify upstream/master; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflict_files="$(git diff --name-only --diff-filter=U || true)"
          {
            echo "status=conflict"
            echo "conflict_files<<EOF"
            echo "${conflict_files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          git merge --abort || true
          echo "Merge conflict; master left at origin/master."

      - name: Push master
        if: steps.merge.outputs.status == 'merged'
        run: git push origin master

      - name: File conflict issue
        if: steps.merge.outputs.status == 'conflict'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --label upstream-sync-conflict --state open --json number --jq '.[0].number' || true)"
          files_body="$(printf '%s' "${CONFLICT_FILES}" | sed '/^$/d')"
          header="Upstream sync conflict on \`${UPSTREAM_SHA}\`"
          body="Automated merge of \`deepseek-ai/deepseek-harness:master\` (${UPSTREAM_SHA}) into \`master\` failed."$'\n\n'"## Conflicting files"$'\n\n'"\`\`\`"$'\n'"${files_body}"$'\n'"\`\`\`"$'\n\n'"Melon \`master\` was not pushed. Resolve on a worktree, keep this workflow file, then re-run."
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --title "${header}" --body "${body}"
            gh issue comment "${existing}" --body "Re-run still failing on \`${UPSTREAM_SHA}\`."
          else
            gh issue create --title "${header}" --label "upstream-sync-conflict" --body "${body}"
          fi

  refresh-feat:
    name: Refresh feat/melon-desktop from master
    needs: update-master
    if: always() && needs.update-master.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out feat branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: feat/melon-desktop

      - name: Merge master into feat
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "melon-sync"
          git config user.email "melon-sync@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin master feat/melon-desktop
          git checkout -B feat/melon-desktop origin/feat/melon-desktop
          master_sha="$(git rev-parse origin/master)"
          echo "master_sha=${master_sha}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "feat already contains ${master_sha}"
            echo "status=up_to_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit --no-ff --no-verify origin/master; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conflict_files="$(git diff --name-only --diff-filter=U || true)"
          {
            echo "status=conflict"
            echo "conflict_files<<EOF"
            echo "${conflict_files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          git merge --abort || true

      - name: Push feat/melon-desktop
        if: steps.refresh.outputs.status == 'merged'
        run: git push origin feat/melon-desktop

      - name: File feat refresh conflict
        if: steps.refresh.outputs.status == 'conflict'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MASTER_SHA: ${{ steps.refresh.outputs.master_sha }}
          CONFLICT_FILES: ${{ steps.refresh.outputs.conflict_files }}
        run: |
          set -euo pipefail
          files_body="$(printf '%s' "${CONFLICT_FILES}" | sed '/^$/d')"
          gh issue create --title "feat/melon-desktop could not take master ${MASTER_SHA:0:12}" --label "upstream-sync-conflict" --body "Automated merge of \`master\` into \`feat/melon-desktop\` failed."$'\n\n'"## Conflicting files"$'\n\n'"\`\`\`"$'\n'"${files_body}"$'\n'"\`\`\`"$'\n\n'"\`feat/melon-desktop\` was not pushed. Resolve locally, keep Melon seams, then push."
