# Daily/manual upstream sync. Fetches deepseek-ai/deepseek-harness:master,
# merges it into a generated branch (sync/upstream-master), pushes only that
# branch, and opens or updates one pull request against Melon master. On a
# merge conflict the workflow never writes master and never auto-merges; it
# files or updates one issue with the failing upstream SHA and the conflicting
# paths. The Melon master branch is only updated by a maintainer merging the
# resulting pull request.
name: Upstream sync

on:
  schedule:
    # Daily at 06:00 UTC; cheap fetch + merge attempt.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

# Queue rather than cancel so two sync attempts can never push the same
# branch concurrently.
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream master
    runs-on: ubuntu-24.04
    # contents:write is scoped to this job so a token leak here can only
    # touch the sync branch and the conflict issue; it cannot reach
    # master or release tags.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out Melon
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream master into sync branch
        id: merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: deepseek-ai/deepseek-harness
          UPSTREAM_REF: master
          SYNC_BRANCH: sync/upstream-master
          TARGET_BRANCH: master
        run: |
          set -uo pipefail
          git config user.name "melon-sync"
          git config user.email "melon-sync@users.noreply.github.com"
          # Leftover lefthook/tsx hooks are not installed on the runner checkout.
          git config core.hooksPath /dev/null
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          # Full history: a 100+ commit gap cannot merge from depth=1 tips.
          git fetch --no-tags upstream "${UPSTREAM_REF}"
          git fetch --no-tags origin "${TARGET_BRANCH}" || true
          git fetch --no-tags origin "${SYNC_BRANCH}" || true

          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_REF}")"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"

          if git show-ref --verify --quiet "refs/remotes/origin/${SYNC_BRANCH}"; then
            git checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"
            if git merge-base --is-ancestor "upstream/${UPSTREAM_REF}" "origin/${SYNC_BRANCH}"; then
              echo "Upstream ${upstream_sha} already contained in ${SYNC_BRANCH}; nothing to do."
              echo "status=up_to_date" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # First sync: create the branch from the Melon master tip.
            git checkout -b "${SYNC_BRANCH}" "origin/${TARGET_BRANCH}"
          fi

          if git merge --no-edit --no-ff --no-verify "upstream/${UPSTREAM_REF}"; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflict_files="$(git diff --name-only --diff-filter=U || true)"
          {
            echo "status=conflict"
            echo "conflict_files<<EOF"
            echo "${conflict_files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Merge conflict; master left untouched."

      - name: Push sync branch
        if: steps.merge.outputs.status == 'merged'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_BRANCH: sync/upstream-master
        run: git push --set-upstream origin "${SYNC_BRANCH}"

      - name: Open or update pull request
        if: steps.merge.outputs.status == 'merged'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_BRANCH: sync/upstream-master
          TARGET_BRANCH: master
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
          body="$(cat <<'HEADER'
          Automated upstream sync.
          HEADER
          )"
          body="${body}"$'\n\n'"Pulls in \`${UPSTREAM_SHA}\` from \`deepseek-ai/deepseek-harness:master\` into \`${SYNC_BRANCH}\`. Merge manually after CI passes; Melon never auto-merges."
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --body "${body}"
            echo "Updated PR #${existing}."
          else
            gh pr create --base "${TARGET_BRANCH}" --head "${SYNC_BRANCH}" --title "Sync upstream master" --body "${body}"
            echo "Opened PR for ${SYNC_BRANCH}."
          fi

      - name: File or update conflict issue
        if: steps.merge.outputs.status == 'conflict'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number' || true)"
          if [ -z "${existing}" ]; then
            existing="$(gh issue list --label upstream-sync-conflict --state open --json number --jq '.[0].number' || true)"
          fi
          files_body="$(printf '%s' "${CONFLICT_FILES}" | sed '/^$/d')"
          header="Upstream sync conflict on \`${UPSTREAM_SHA}\`"
          body="Automated merge of \`deepseek-ai/deepseek-harness:master\` (${UPSTREAM_SHA}) into \`sync/upstream-master\` could not be applied automatically."$'\n\n'"## Conflicting files"$'\n\n'"\`\`\`"$'\n'"${files_body}"$'\n'"\`\`\`"$'\n\n'"Melon master is untouched. Resolve manually by preserving upstream runtime first, reapplying Melon only at the listed seams, then re-run this workflow."
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --title "${header}" --body "${body}"
            gh issue comment "${existing}" --body "Re-run still failing on \`${UPSTREAM_SHA}\`."$'\n\n'"## Conflicting files"$'\n\n'"\`\`\`"$'\n'"${files_body}"$'\n'"\`\`\`"
            echo "Updated issue #${existing}."
          else
            gh issue create --title "${header}" --label "upstream-sync-conflict" --body "${body}"
            echo "Opened conflict issue."
          fi
